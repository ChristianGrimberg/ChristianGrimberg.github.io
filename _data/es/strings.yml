site_title: Christian Grimberg - Curriculum Vitae
job_title: Jefe de Sistemas
executive_summary: '<p>Trabajo para que la tecnología resuelva problemas concretos y acompañe la evolución del negocio. Como Jefe de Sistemas en Laboratorios Novocap, combino el liderazgo del área con el trabajo técnico: infraestructura cloud e híbrida, integración de sistemas y automatización de procesos.</p><p>Mi recorrido en la industria farmacéutica incluye la implementación de SAP S/4HANA y soluciones con .NET, SQL Server y PowerShell. También trabajo con Azure DevOps, Microsoft Fabric, Microsoft 365 Copilot y Copilot Studio para conectar datos, procesos y herramientas útiles para la organización.</p>'
