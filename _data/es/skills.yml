# Habilidades Técnicas
- skill: "Soluciones Cloud (IaaS, PaaS, SaaS e IaC)"
  description: >
    Especialista en Microsoft Azure para el diseño e implementación de
    soluciones de infraestructura Cloud e híbrida escalables.

- skill: "Desarrollo de Software (.NET Core)"
  description: >
    Desarrollo backend y de aplicaciones utilizando .NET Core,
    incluyendo buenas prácticas de código limpio e ingeniería de
    software moderna.

- skill: "Bases de Datos (SQL Server y MariaDB/MySQL)"
  description: >
    Administración y desarrollo de bases de datos relacionales con
    SQL Server y MariaDB/MySQL, incluyendo ORM con Entity Framework
    Core.

- skill: "Soluciones IoT"
  description: >
    Desarrollo de soluciones IoT con Arduino, integrando dispositivos
    físicos con sistemas de software.

- skill: "Networking (Cisco, Fortinet y Watchguard)"
  description: >
    Administración de redes con switches Cisco, routers Fortinet y
    firewalls Watchguard.

- skill: "Contenedores y Orquestación"
  description: >
    Despliegue de contenedores Docker en producción. Orquestación con
    Docker Swarm en producción y Kubernetes como interés personal.

- skill: "Administración de Servidores"
  description: >
    Administración de parques de Windows Server y Linux (Ubuntu Server,
    CentOS), incluyendo instalación, hardening y mantenimiento continuo.

- skill: "Control de Versiones y Toolchain DevOps"
  description: >
    Ciclo de vida de Desarrollo de Software con Git, Azure DevOps,
    GitHub Actions, GitHub Packages y GitHub Registry.

- skill: "Scripting (PowerShell y GNU Bash)"
  description: >
    Automatización de tareas operativas y de despliegue repetitivas
    mediante scripting con PowerShell y GNU Bash Shell.
