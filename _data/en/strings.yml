job_title: Head of Systems
executive_summary: <p>I help technology solve practical problems and support the business as it evolves. As Head of Systems at Laboratorios Novocap, I combine team leadership with hands-on technical work across cloud and hybrid infrastructure, systems integration and process automation.</p><p>My experience in the pharmaceutical industry includes implementing SAP S/4HANA and building solutions with .NET, SQL Server and PowerShell. I also work with Azure DevOps, Microsoft Fabric, Microsoft 365 Copilot and Copilot Studio to connect data, processes and useful tools for the organization.</p>
