job_title: Head of Systems
executive_summary: >-
  <p>I lead the IT team at Laboratorios Novocap, connecting technology with business priorities and the needs of the people who use it. I combine team and project leadership with hands-on technical involvement, from defining solutions through implementation.</p>
  <p>Throughout my career in the pharmaceutical industry, I have contributed to technology initiatives including the implementation of SAP S/4HANA, Microsoft Azure solutions, systems integration and process automation. I also work with tools such as Microsoft Fabric and Copilot to explore new ways of using data and artificial intelligence.</p>
  <p>I believe technology should make a practical difference: simplifying the way teams work, providing useful information for decisions and supporting the organization’s growth, while taking into account the quality and security requirements of the industry.</p>
