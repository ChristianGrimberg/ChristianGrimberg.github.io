name: Validate bilingual CV
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build site without deploying
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check bilingual pages and content
        run: ruby script/validate_cv.rb
