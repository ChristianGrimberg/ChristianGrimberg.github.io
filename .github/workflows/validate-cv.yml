name: Validate bilingual CV
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build site without deploying
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check bilingual pages and content
        run: ruby script/validate_cv.rb
      - name: Render review previews from the Jekyll build
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium)"
          mkdir -p preview-artifacts
          python3 -m http.server 4000 --directory _site >/tmp/cv-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null; then break; fi
            sleep 1
          done
          for lang in en es; do
            prefix=""
            if [ "$lang" = "es" ]; then prefix="es/"; fi
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --timeout=10000 --window-size=1440,1100 --screenshot="$(pwd)/preview-artifacts/$lang-desktop.png" "http://127.0.0.1:4000/$prefix"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --timeout=10000 --window-size=390,844 --screenshot="$(pwd)/preview-artifacts/$lang-mobile.png" "http://127.0.0.1:4000/$prefix"
            "$CHROME" --headless --no-sandbox --disable-gpu --timeout=10000 --no-pdf-header-footer --print-to-pdf="$(pwd)/preview-artifacts/cv-$lang.pdf" "http://127.0.0.1:4000/${prefix}cv/"
          done
      - name: Install PDF text extraction tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Validate PDF text readability (not an ATS score)
        run: ruby script/validate_pdf.rb preview-artifacts
      - name: Upload review previews (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: cv-review-previews
          path: preview-artifacts/
          retention-days: 14
