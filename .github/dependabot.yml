# Dependabot configuration
# Groups Bundler updates into a single weekly PR so changes land atomically
# instead of the historical one-PR-per-gem pattern (which produced #4/#5
# cross-conflicts on the json line in Gemfile.lock).
# Note: the "Re-run Dependabot checks" button appears automatically on every
# PR opened by Dependabot (no config knob needed). To force an out-of-band
# scan without waiting for the weekly schedule, click that button on any
# Dependabot PR's timeline (e.g. once the first Actions-bump PR opens, you
# can re-trigger it to surface additional pending bumps).
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group all non-major bumps into a single PR
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Keep major bumps as standalone PRs so they get explicit review
    # (default behavior when groups are defined but no match)
    labels:
      - "dependencies"
      - "ruby"
      - "automated"
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group all non-major bumps into a single PR
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Keep major bumps as standalone PRs so they get explicit review
    # (default behavior when groups are defined but no match)
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
      - "automated"
    commit-message:
      prefix: ":arrow_up:"